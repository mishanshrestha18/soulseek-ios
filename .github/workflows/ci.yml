name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'LICENSE*']
  pull_request:
    branches: [main]
    paths-ignore: ['**/*.md', 'LICENSE*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # LiveServerTests reads this and disables itself; it hits the real
  # Soulseek server, which throttles GitHub runner IPs.
  CI: "true"

jobs:
  # Fast logic check. Runs the whole suite natively — no simulator boot.
  host-test:
    name: Test (host)
    runs-on: macos-26
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Packages/SeeleseekCore
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: swift --version && xcodebuild -version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
        timeout-minutes: 10

  # The one that matters: proves SeeleseekCore actually compiles for iOS.
  ios-build:
    name: Build (iOS)
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: Packages/SeeleseekCore
    steps:
      - uses: actions/checkout@v4
      - name: Build for iOS Simulator
        run: xcodebuild build -scheme SeeleseekCore -destination 'generic/platform=iOS Simulator'
      - name: Build for iOS device
        run: xcodebuild build -scheme SeeleseekCore -destination 'generic/platform=iOS'

  ios-test:
    name: Test (iOS Simulator)
    runs-on: macos-26
    timeout-minutes: 40
    needs: ios-build
    steps:
      - uses: actions/checkout@v4
      # Device names churn between Xcode releases; resolve one at runtime
      # instead of hardcoding a name that breaks on the next runner image.
      - name: Resolve simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available --json | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for rt, ds in sorted(d.items()) if 'iOS' in rt for x in ds))")
          echo "Using simulator $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      # Several tests drive real sockets and listeners. A wedged simulator
      # hangs them indefinitely, which otherwise burns the full job timeout
      # at the 10x macOS billing rate before reporting anything useful.
      # The workflow-level `CI` var reaches xcodebuild but NOT the test process
      # running inside the simulator, which is separately spawned. Without it,
      # LiveServerTests hits the real Soulseek server from a runner IP and the
      # CI-scaled waits stay at their local values. SIMCTL_CHILD_* is the
      # documented way to push env into simulator-hosted processes;
      # TEST_RUNNER_* covers the xctestrun path. Both are set deliberately.
      - name: Test
        working-directory: Packages/SeeleseekCore
        env:
          SIMCTL_CHILD_CI: "true"
        run: xcodebuild test -scheme SeeleseekCore -destination "id=${{ steps.sim.outputs.udid }}" -test-timeouts-enabled YES -default-test-execution-time-allowance 120 -maximum-test-execution-time-allowance 300 TEST_RUNNER_CI=true

  app-build:
    name: Build (app)
    runs-on: macos-26
    timeout-minutes: 30
    needs: ios-build
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      # The .xcodeproj is generated, not committed — it cannot be opened or
      # regenerated on the Windows machine this is developed on.
      - name: Generate project
        working-directory: App
        run: xcodegen generate
      - name: Build
        working-directory: App
        run: xcodebuild build -project Soulseek.xcodeproj -scheme Soulseek -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO
